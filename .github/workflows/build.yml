name: Build Kona Kernel

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout build config
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            zip zstd cpio

      - name: Fetch kernel source
        run: |
          git clone --depth 1 https://github.com/lualua99/Realking_kernel_sm8250.git kernel
          cd kernel
          git config core.protectNTFS false
          echo "--- source version ---"
          head -5 Makefile

      - name: Patch broken CC override
        run: |
          set -euxo pipefail
          cd kernel
          echo "=== BEFORE ==="
          grep -n 'gcc-wrapper' Makefile || echo "(none found)"
          grep -n '^PYTHON' Makefile || true
          # fork 作者残留：CC = $(PYTHON2) $(srctree)/scripts/gcc-wrapper.py $(REAL_CC)
          # python2 在 ubuntu-22.04 不存在 / gcc-wrapper.py 未提交 / REAL_CC 未定义
          # 这一行无条件覆盖了 384-404 行正确定义的 CC，必须删掉
          sed -i '/gcc-wrapper\.py/d' Makefile
          echo "=== AFTER ==="
          grep -n 'gcc-wrapper' Makefile || echo "removed OK"
          echo "--- effective CC definitions ---"
          grep -n '^CC' Makefile || true

      - name: Show config deltas
        run: |
          echo "=== what we changed vs stock ==="
          grep -E 'MODULE_SIG_FORCE|^CONFIG_KPROBES|BUILD_ARM64_KERNEL_COMPRESSION|BUILD_ARM64_UNCOMPRESSED' device.config || true

      - name: Configure
        run: |
          set -euxo pipefail
          cd kernel
          mkdir -p out
          cp ../device.config out/.config
          make ARCH=arm64 O=out olddefconfig
          echo "=== effective critical options ==="
          grep -E 'MODULE_SIG_FORCE|^CONFIG_KPROBES=' out/.config || true
          echo "=== image target ==="
          grep -E 'BUILD_ARM64_KERNEL_COMPRESSION_GZIP|BUILD_ARM64_UNCOMPRESSED_KERNEL' out/.config || true

      - name: Expand swap and set low-jobs
        run: |
          set -euxo pipefail
          echo "=== memory before ==="
          free -h
          echo "=== swap before ==="
          swapon --show || echo "(none)"
          # GitHub runner 只有 7 GB RAM，4.19 内核 -j4 会 OOM
          sudo fallocate -l 8G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=8192
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          echo "=== memory after ==="
          free -h
          swapon --show

      - name: Build Image
        run: |
          set -o pipefail
          cd kernel
          echo "=== jobs: 2 (memory safety) ==="
          make ARCH=arm64 O=out -j2 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image 2>&1 | tee /tmp/build.log
          echo "=== make exit: $? ==="
          echo "=== memory peak ==="
          free -h

      - name: Build dtbs
        continue-on-error: true
        run: |
          cd kernel
          make ARCH=arm64 O=out -j2 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            dtbs 2>&1 | tail -30 || echo "dtbs failed (non-fatal)"

      - name: Diagnose output tree
        if: always()
        run: |
          echo "=== out/arch/arm64/boot/ ==="
          ls -la kernel/out/arch/arm64/boot/ 2>&1 || echo "boot dir missing"
          echo
          echo "=== any Image anywhere ==="
          find kernel/out -name 'Image' -o -name 'Image.gz' 2>/dev/null | head -20
          echo
          echo "=== dtb count ==="
          find kernel/out -name '*.dtb' 2>/dev/null | wc -l
          echo
          echo "=== last 60 lines of build log ==="
          tail -60 /tmp/build.log 2>&1 || echo "no build log"

      - name: Collect artifacts
        run: |
          set -euxo pipefail
          mkdir -p artifact
          IMG=$(find kernel/out -name 'Image' -type f | head -1)
          if [ -z "$IMG" ]; then
            echo "FATAL: no Image produced"
            find kernel/out -maxdepth 4 -type d | head -30
            exit 1
          fi
          cp -v "$IMG" artifact/Image
          # dtbs are optional
          find kernel/out/arch/arm64/boot/dts -name 'kona*.dtb' -exec cp -v {} artifact/ \; 2>/dev/null || true
          echo "=== artifact contents ==="
          ls -lh artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kona-kernel
          path: artifact/
          retention-days: 14
          if-no-files-found: error
