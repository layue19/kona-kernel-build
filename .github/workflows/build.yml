name: Build Kona Kernel

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout build config
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            zip zstd

      - name: Fetch kernel source
        run: |
          git clone --depth 1 https://github.com/lualua99/Realking_kernel_sm8250.git kernel
          cd kernel
          git config core.protectNTFS false
          echo "kernel version:" && head -5 Makefile

      - name: Show what we changed
        run: |
          echo "=== critical config diff ==="
          grep -E 'MODULE_SIG_FORCE|^CONFIG_KPROBES' device.config || true

      - name: Configure
        run: |
          cd kernel
          mkdir -p out
          cp ../device.config out/.config
          make ARCH=arm64 O=out olddefconfig 2>&1 | tail -5
          echo "=== resulting critical options ==="
          grep -E 'MODULE_SIG_FORCE|^CONFIG_KPROBES' out/.config || true

      - name: Build kernel
        run: |
          cd kernel
          make ARCH=arm64 O=out -j"$(nproc)" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image.gz dtbs 2>&1 | tail -40

      - name: Collect artifacts
        run: |
          mkdir -p artifact
          for f in Image.gz Image; do
            if [ -f "kernel/out/arch/arm64/boot/$f" ]; then
              cp "kernel/out/arch/arm64/boot/$f" artifact/
              echo "got $f"
            fi
          done
          find kernel/out/arch/arm64/boot/dts/qcom -name '*.dtb' -exec cp {} artifact/ \; 2>/dev/null || true
          echo "=== artifact ==="
          ls -lh artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kona-kernel
          path: artifact/
          retention-days: 14
